name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-install-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base package without optional AI dependencies
        run: python -m pip install -e .

      - name: Smoke-test deterministic command imports
        run: |
          exam-bank --help
          exam-bank extract --help
          python -c "import exam_bank.cli"

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Check imports and correctness
        run: python -m ruff check

      - name: Run data-independent unit tests
        run: >-
          python -m coverage run -m pytest
          -m "not integration and not rendering and not sample_pipeline"
          --durations=20 --durations-min=0.5

      - name: Report unit coverage
        run: python -m coverage report --skip-covered

  fixture-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Restore checksum-backed corpus cache
        uses: actions/cache@v4
        with:
          path: input/pastpapers
          key: caie-9709-corpus-${{ hashFiles('manifests/corpora/caie_9709.active_partial.v1.json') }}

      - name: Hydrate and verify fixture corpus
        run: |
          exam-bank data hydrate \
            --manifest manifests/corpora/caie_9709.active_partial.v1.json \
            --root input \
            --timeout 120
          exam-bank data verify \
            --manifest manifests/corpora/caie_9709.active_partial.v1.json \
            --root input

      - name: Run fixture-backed integration and rendering tests
        run: >-
          python -m pytest
          -m "integration or rendering or sample_pipeline"
          --durations=30 --durations-min=1.0
