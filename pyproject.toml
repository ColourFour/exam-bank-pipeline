[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-bank-pipeline"
version = "0.1.0"
description = "Image-first CAIE 9709 exam-bank extraction and normalization pipeline."
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24.0",
  "Pillow>=10.0.0",
  "pytesseract>=0.3.10",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
ai = [
  "openai>=1.60.0",
]
dev = [
  "coverage[toml]>=7.6.0",
  "openai>=1.60.0",
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[project.scripts]
exam-bank = "exam_bank.command:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exam_bank = [
  "runtime_profile.json",
  "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: slower tests that exercise PDF/sample-pipeline flows against repository fixtures.",
  "rendering: image and crop rendering behavior tests.",
  "sample_pipeline: repository sample-pipeline regression tests, usually also integration.",
]

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["src/exam_bank/**/*.py"]

[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823"]

[tool.ruff.lint.per-file-ignores]
# Pillow is imported lazily inside render functions; these names are used only
# in postponed annotations and are deliberately unavailable at module import.
"src/exam_bank/image_rendering.py" = ["F821"]
"src/exam_bank/mark_schemes.py" = ["F821"]

[tool.coverage.run]
branch = true
source = ["exam_bank"]

[tool.coverage.report]
skip_empty = true
